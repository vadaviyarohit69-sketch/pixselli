name: I18N Smoke Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  i18n-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Run i18n route smoke suite
        shell: bash
        run: |
          python3 -m http.server 3000 --directory out >/tmp/i18n-http-server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null; then
              break
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:3000 npm run test:i18n-routes
